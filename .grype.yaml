disabled: false

ignore:
  # The two below have NO patched release published; dev tooling only. Mirrors
  # the audit-ci.jsonc allowlist. Remove when braces 3.0.4 / sprintf-js 1.1.4 ship.
  - vulnerability: GHSA-vfj7-8cjw-p6xm
    include-aliases: true
    reason: 'braces: no patched release exists (<= 3.0.3 affected, 3.0.3 is latest); dev tooling only'
  - vulnerability: GHSA-hp3w-g68c-fv3c
    include-aliases: true
    reason: 'sprintf-js: no patched release exists (<= 1.1.3 affected, 1.1.3 is latest); dev tooling only'
  # convict prototype pollution (via @mojaloop/central-services-shared); no fixed release exists (<=6.2.4 is latest) - 2026-07-07
  - vulnerability: GHSA-44fc-8fm5-q62h
  - vulnerability: GHSA-hf2r-9gf9-rwch

# Set output format defaults
output:
  - "table"
  - "json"

# Modify your CircleCI job to check critical count
search:
  scope: "squashed"
quiet: false
check-for-app-update: false
